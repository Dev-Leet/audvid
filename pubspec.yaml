name: nirpadam_model_tester
description: Standalone test harness for NIRPADAM's audio (YAMNet) and vision (EfficientDet-Lite0 + MoViNet-Stream) models — validates model behavior in isolation before integration into the Risk Engine.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  tflite_flutter: ^0.11.0
  camera: ^0.11.0
  record: ^5.1.2          # real mic capture with configurable PCM output
  permission_handler: ^11.3.1
  battery_plus: ^6.0.2     # for the synthetic-battery UI to mimic real reads if desired
  image: ^4.2.0            # YUV->RGB conversion (matches main app's vision_preprocessing.dart)
  path_provider: ^2.1.4    # AUDIT FIX (T-1): was imported by mic_capture_service.dart but never declared

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/config/